name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and lint on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only supported, non-EOL majors. Every step below is keyed to the matrix as a whole and
        # nothing is conditioned on a single version, so dropping or adding a major here cannot
        # leave a step silently skipped.
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      # This project is on npm with a committed package-lock.json, so there is no pnpm here at all
      # and nothing to pin beyond the Node major.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # `build` is also the typecheck: both tsc projects compile the whole of src/ under
      # `strict: true` with `declaration: true`, so a type error fails right here. The repo has no
      # separate typecheck script and none is invented for CI.
      - name: Build and typecheck
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run test:lint

      - name: Formatting
        run: npm run test:prettier

      - name: Spelling
        run: npm run test:spelling

  # The job that tests what users actually receive.
  #
  # Everything above runs against the working tree, where src/, node_modules/ and the repo's own
  # tsconfig are all present. None of that ships. What ships is the tarball, filtered through the
  # `files` allowlist in package.json, resolved against a dependency tree it does not control. A
  # green suite and a broken package are entirely compatible states, and in this family of
  # repositories the broken package is where the expensive defects have actually lived: a `files`
  # rule that omitted a JSON file the code loaded at runtime and so crashed every consumer, a
  # binary that could not start on a Node version CI never exercised, and a build output that was
  # simply absent. Every one of those shipped green.
  #
  # So this job builds the tarball, installs it into an empty directory that is not the repo, and
  # runs the command the README tells people to run.
  package:
    name: Packaged artifact on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is pinned exactly, and it is not here because Node 20 is current: it is the floor
        # of the `engines.node` range this package declares, and the whole point is that the floor
        # of a support claim has to be executed rather than asserted. `engines` previously said
        # `>=18` while the packaged CLI died on Node 18 with ERR_REQUIRE_ESM, and it said so for as
        # long as it did precisely because no job ever ran the bottom of the range. If the range
        # changes, change this entry with it.
        node-version: ['20.19.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # build/ is gitignored, so without this the tarball ships nothing but metadata. That failure
      # mode has happened before in a sibling repo and it is invisible from the source tree.
      - name: Build
        run: npm run build

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          PACKDIR="$RUNNER_TEMP/pack"
          rm -rf "$PACKDIR"
          mkdir -p "$PACKDIR"
          npm pack --pack-destination "$PACKDIR"
          TARBALL="$(find "$PACKDIR" -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "$TARBALL" ]; then
            echo "::error::npm pack produced no tarball."
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL, containing:"
          tar -tzf "$TARBALL" | sort

      - name: Install the tarball into an empty directory
        id: consumer
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/consumer"
          rm -rf "$CONSUMER"
          mkdir -p "$CONSUMER/prisma"
          cd "$CONSUMER"
          npm init -y >/dev/null
          # Installed from the tarball, outside the repo: this is the only way the `files`
          # allowlist and the real dependency resolution get exercised.
          npm install "${{ steps.pack.outputs.tarball }}"
          echo "dir=$CONSUMER" >> "$GITHUB_OUTPUT"

      - name: Run the README headline command against that install
        working-directory: ${{ steps.consumer.outputs.dir }}
        run: |
          set -euo pipefail

          # Deliberately out of order, and carrying a generator, a datasource, an enum and a
          # comment, because the sorter rewrites the file from the sections it collected and
          # anything it fails to collect is destroyed rather than left alone.
          cat > prisma/schema.prisma <<'SCHEMA'
          // keep this comment attached to Zebra
          model Zebra {
            id Int @id @default(autoincrement())
          }

          generator client {
            provider = "prisma-client-js"
          }

          enum Status {
            ACTIVE
            INACTIVE
          }

          datasource db {
            provider = "postgresql"
            url      = env("DATABASE_URL")
          }

          model Apple {
            id Int @id @default(autoincrement())
          }
          SCHEMA

          # Never inlined into a test: an absent pattern yields an empty string, and `[ "" -lt 3 ]`
          # is a usage error rather than a failed comparison, which an `if` would quietly absorb.
          line_of() {
            grep -n "^$1" prisma/schema.prisma | head -1 | cut -d: -f1 || true
          }

          require_ordered() {
            local first_line second_line
            first_line="$(line_of "$1")"
            second_line="$(line_of "$2")"
            if [ -z "$first_line" ] || [ -z "$second_line" ]; then
              echo "::error::Expected both '$1' and '$2' in the schema; found [$first_line] and [$second_line]."
              return 1
            fi
            [ "$first_line" -lt "$second_line" ]
          }

          # Guard the guard. If the fixture were already sorted, the ordering assertion below would
          # pass without the package having done anything, and this job would be decoration.
          if require_ordered 'model Apple' 'model Zebra'; then
            echo "::error::Fixture is already sorted, so this job cannot detect a sorter that does nothing."
            exit 1
          fi

          echo "--- npx prisma-schema-sorter sort --schema=./prisma/schema.prisma ---"
          set +e
          OUTPUT="$(npx prisma-schema-sorter sort --schema="./prisma/schema.prisma" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          echo "--- exit status: $STATUS ---"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::The README headline command exited $STATUS against the packaged artifact."
            exit 1
          fi

          # The output checks below used to be the only real signal, because up to 1.5.0 the exit
          # status carried none: sortPrismaSchema caught every error, printed "Failed." and returned
          # normally, so a total failure to read or write the schema still exited 0. That is fixed,
          # and the negative cases in the next step are what hold it fixed. These two stay as a
          # cross-check that status and output agree, which is cheap and catches a half-fix.
          case "$OUTPUT" in
            *Failed.*)
              echo "::error::The command reported 'Failed.' while still exiting 0."
              exit 1
              ;;
          esac
          case "$OUTPUT" in
            *Success.*) ;;
            *)
              echo "::error::The command printed no 'Success.', so the sort did not complete."
              exit 1
              ;;
          esac

          echo "--- resulting schema ---"
          cat prisma/schema.prisma

          if ! require_ordered 'model Apple' 'model Zebra'; then
            echo "::error::Models were not sorted: Apple should now precede Zebra."
            exit 1
          fi

          # Nothing may be silently dropped on the way through. The sorter rebuilds the file from
          # the sections it recognised, so a section it fails to collect is lost, not left alone.
          for required in \
            'model Apple' \
            'model Zebra' \
            'generator client' \
            'datasource db' \
            'enum Status' \
            '// keep this comment attached to Zebra'
          do
            if ! grep -qF "$required" prisma/schema.prisma; then
              echo "::error::The sorter destroyed a section it should have preserved: $required"
              exit 1
            fi
          done

          echo "Packaged artifact sorted the schema correctly and preserved every section."

      # A green exit status only means something if some invocation can make it red. Up to 1.5.0
      # none could: every failure was caught, printed and swallowed, so `sort --schema=./nope.prisma`
      # exited 0 and no script or CI step could tell it from a successful sort. These are the cases
      # that would have caught that, run against the packaged artifact rather than the working tree.
      - name: Fail loudly, not silently, against that install
        working-directory: ${{ steps.consumer.outputs.dir }}
        run: |
          set -uo pipefail

          FAILURES=0

          require_status() {
            local want="$1" label="$2"
            shift 2
            local output status
            output="$("$@" 2>&1)"
            status=$?
            echo "--- $label -> exit $status ---"
            echo "$output"
            if [ "$want" = "nonzero" ] && [ "$status" -eq 0 ]; then
              echo "::error::$label exited 0. A caller cannot distinguish this from a successful sort."
              FAILURES=$((FAILURES + 1))
            fi
            if [ "$want" = "zero" ] && [ "$status" -ne 0 ]; then
              echo "::error::$label exited $status, but it should have succeeded."
              FAILURES=$((FAILURES + 1))
            fi
          }

          # The schema cannot be read at all. This is the case that shipped broken.
          require_status nonzero 'missing schema' \
            npx prisma-schema-sorter sort --schema=./definitely-not-here.prisma
          # Unreadable for a different reason, to show the exit code follows the error rather than
          # one special-cased ENOENT branch.
          require_status nonzero 'schema path is a directory' \
            npx prisma-schema-sorter sort --schema=./prisma
          # Sorted nothing and said nothing, which used to also exit 0.
          require_status nonzero 'no command given' npx prisma-schema-sorter
          require_status nonzero 'unknown command' npx prisma-schema-sorter srot
          # A misspelled --schema used to be ignored, so the tool silently sorted the default path,
          # or nothing, and reported success.
          require_status nonzero 'misspelled option' \
            npx prisma-schema-sorter sort --shcema=./prisma/schema.prisma
          # The guard on the guard: --help must still be a success, so "nonzero" is not the answer to
          # everything.
          require_status zero '--help' npx prisma-schema-sorter --help

          if [ "$FAILURES" -ne 0 ]; then
            echo "::error::$FAILURES exit-status check(s) failed against the packaged artifact."
            exit 1
          fi
          echo "Every failing invocation exited non-zero and the successful one exited 0."

      - name: Run the README programmatic example against that install
        working-directory: ${{ steps.consumer.outputs.dir }}
        # Covers the `main` and `typings` entrypoints, which the CLI path never touches. An
        # entrypoint that does not resolve is invisible until someone requires the installed
        # package. It must also reject rather than log: a caller cannot read a console message, so
        # logging and resolving anyway left programmatic users with no way to detect a failed sort.
        run: |
          set -euo pipefail
          OUTPUT="$(node -e "
            const { sortPrismaSchema } = require('prisma-schema-sorter');
            if (typeof sortPrismaSchema !== 'function') {
              throw new Error('main entrypoint did not export sortPrismaSchema');
            }
            const assertRejects = async () => {
              let rejected = false;
              try {
                await sortPrismaSchema('./definitely-not-here.prisma');
              } catch {
                rejected = true;
              }
              if (!rejected) {
                throw new Error('sortPrismaSchema resolved on a schema it could not read');
              }
            };
            assertRejects()
              .then(() => sortPrismaSchema('./prisma/schema.prisma'))
              .then(() => console.log('Programmatic entrypoint rejected on failure and resolved on success.'))
              .catch((error) => {
                console.error(error);
                process.exitCode = 1;
              });
          " 2>&1)"
          echo "$OUTPUT"
          case "$OUTPUT" in
            *'rejected on failure and resolved on success'*) ;;
            *)
              echo "::error::The programmatic entrypoint did not behave as documented."
              exit 1
              ;;
          esac
          echo "Programmatic entrypoint resolved and ran from the installed package."
